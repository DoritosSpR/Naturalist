plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version
    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_mc
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', archives_name
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', archives_name
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        naturalist {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url "https://maven.parchmentmc.org" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "maven.modrinth:midnightlib:${midnightlib_version}"
    compileOnly "maven.modrinth:lambdynamiclights:CQuTG9xY"
    runtimeOnly "maven.modrinth:lambdynamiclights:CQuTG9xY"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName.set("${archives_name}-${mod_version}+neoforge-${minecraft_version}.jar")
}
